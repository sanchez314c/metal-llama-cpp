name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Shell Script Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install ShellCheck
      run: sudo apt-get install -y shellcheck

    - name: Lint install-metallama.sh
      run: shellcheck --severity=warning install-metallama.sh

  validate:
    name: Script Validation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check script syntax (bash -n)
      run: bash -n install-metallama.sh

    - name: Verify script is executable
      run: |
        if [ ! -x install-metallama.sh ]; then
          echo "ERROR: install-metallama.sh is not executable"
          exit 1
        fi
        echo "install-metallama.sh has executable permission"

    - name: Verify required files exist
      run: |
        required_files=(
          "README.md"
          "LICENSE"
          "CHANGELOG.md"
          "CONTRIBUTING.md"
          "CODE_OF_CONDUCT.md"
          "SECURITY.md"
          ".editorconfig"
          ".gitignore"
        )
        missing=0
        for f in "${required_files[@]}"; do
          if [ ! -f "$f" ]; then
            echo "MISSING: $f"
            missing=1
          else
            echo "OK: $f"
          fi
        done
        if [ "$missing" -eq 1 ]; then
          echo "ERROR: Required files are missing"
          exit 1
        fi

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check for broken markdown links (internal)
      run: |
        errors=0
        for md in $(find . -name "*.md" -not -path "./archive/*" -not -path "./node_modules/*"); do
          # Check for empty files
          if [ ! -s "$md" ]; then
            echo "WARNING: Empty markdown file: $md"
          fi
        done
        echo "Markdown files checked"
